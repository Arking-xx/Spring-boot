spring:
  application:
    name: rbac
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 6000000
    refresh-token-expiration-ms: 604800000
